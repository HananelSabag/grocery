<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover is what lets the safe-area-inset-* values be
         non-zero on notched phones; without it the composer sits under the
         home indicator. maximum-scale is deliberately absent: pinch-zoom
         stays available, only the iOS focus-zoom is avoided (by 16px inputs). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#16a34a" />
    <meta name="description" content="רשימת קניות משותפת למשפחה" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>רשימת קניות</title>
  </head>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
